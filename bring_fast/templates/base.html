<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "Bring Fast" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg0:#07110c; --bg1:#0d1c14; --card:rgba(16,32,24,.78);
      --ink:#f3f7f2; --muted:#9bb0a3; --line:rgba(255,255,255,.08);
      --acc:#7CFFB2; --acc2:#c8f56a; --bad:#ff7a7a;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:var(--ink);
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 10% -10%, #1b4d32 0%, transparent 55%),
        radial-gradient(800px 420px at 110% 0%, #3a2a10 0%, transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 40%, #08140e);
    }
    a { color:var(--acc); text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 90px; }
    nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; color:var(--ink); }
    .mark {
      width:42px; height:42px; border-radius:14px;
      background: linear-gradient(145deg, var(--acc), #2bd67a);
      color:#062315; font-weight:800; display:grid; place-items:center;
      letter-spacing:-1px; font-size:18px;
      box-shadow:0 10px 30px rgba(124,255,178,.25);
    }
    .brand b { font-family: Fraunces, Georgia, serif; font-size:22px; font-weight:700; }
    .brand span { display:block; color:var(--muted); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
    h1 { font-family: Fraunces, Georgia, serif; font-size:42px; line-height:1.05; margin:0 0 10px; }
    .lead { color:var(--muted); margin:0 0 28px; max-width:52ch; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
    .card {
      background:var(--card); border:1px solid var(--line); border-radius:22px;
      padding:22px; backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
    }
    .store { position:relative; overflow:hidden; }
    .store:before {
      content:""; position:absolute; inset:auto -20px -40px auto; width:140px; height:140px;
      background: radial-gradient(circle, color-mix(in srgb, var(--store,#7CFFB2) 35%, transparent), transparent 70%);
    }
    .head { display:flex; gap:14px; align-items:center; margin-bottom:14px; position:relative; }
    .logo {
      width:64px; height:64px; border-radius:16px; background:#fff; object-fit:contain;
      padding:8px; border:1px solid var(--line);
    }
    .head h2 { margin:0; font-size:20px; }
    .site { color:var(--muted); font-size:12px; word-break:break-all; }
    label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; font-weight:600; }
    input {
      width:100%; padding:12px 13px; border-radius:12px; border:1px solid var(--line);
      background:#08140e; color:var(--ink); font:inherit;
    }
    button, .btn {
      border:0; cursor:pointer; font:inherit; font-weight:800;
      background:linear-gradient(180deg, var(--acc), #4fe396); color:#062315;
      padding:12px 16px; border-radius:12px;
    }
    .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:600; }
    .ok { color:var(--acc); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .off { color:var(--muted); font-size:12px; }
    .err { color:var(--bad); }
    .token, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; word-break:break-all; }
    .mcp { background:linear-gradient(180deg, rgba(124,255,178,.08), transparent); }
    .split { display:flex; gap:10px; flex-wrap:wrap; }
    .split > * { flex:1; min-width:160px; }
    .user { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="/">
        <div class="mark">FB</div>
        <div><b>Bring Fast</b><span>Grocery MCP</span></div>
      </a>
      {% if user %}
        <div class="user">{{ user.email }} · <a href="/logout">Log out</a></div>
      {% endif %}
    </nav>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    {% if notice %}<p class="ok">{{ notice }}</p>{% endif %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
