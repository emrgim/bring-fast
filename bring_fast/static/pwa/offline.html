<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#ffffff"/>
  <meta name="color-scheme" content="light dark"/>
  <title>Offline · Bring Fast</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <style>
    /* Saved on the device with the rest of the shell, so this screen looks
       like the app even on the first launch with no network. */
    @font-face {
      font-family:"IBM Plex Mono"; font-style:normal; font-weight:400; font-display:swap;
      src:url(/static/fonts/ibm-plex-mono-400-latin.woff2) format("woff2");
    }
    @font-face {
      font-family:"IBM Plex Mono"; font-style:normal; font-weight:700; font-display:swap;
      src:url(/static/fonts/ibm-plex-mono-700-latin.woff2) format("woff2");
    }
    :root { --bg:#fff; --ink:#111; --muted:#444; --line:#111; --fill:#111; --on-fill:#fff; color-scheme:light; }
    :root[data-theme="dark"] { --bg:#0a0a0a; --ink:#f5f5f5; --muted:#b5b5b5; --line:#f5f5f5; --fill:#f5f5f5; --on-fill:#0a0a0a; color-scheme:dark; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
    body {
      background:var(--bg); color:var(--ink);
      font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    }
    .wrap {
      max-width:520px; margin:0 auto;
      padding:14vh 16px calc(40px + env(safe-area-inset-bottom));
      padding-top:max(14vh, env(safe-area-inset-top));
    }
    button, a { touch-action:manipulation; }
    .mark {
      width:42px; height:42px; background:var(--fill); color:var(--on-fill);
      font-weight:700; display:grid; place-items:center; letter-spacing:-1px; font-size:15px;
      margin:0 0 18px;
    }
    h1 { font-size:24px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.02em; }
    p { color:var(--muted); line-height:1.5; margin:0 0 14px; }
    .card { border:1px dashed var(--line); padding:12px 14px; margin:0 0 18px; }
    .card b { color:var(--ink); }
    .links { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px; }
    .links a {
      color:var(--ink); text-decoration:none; border:1px solid var(--line);
      padding:8px 12px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    }
    button {
      font:inherit; font-weight:700; cursor:pointer; border:1px solid var(--fill);
      background:var(--fill); color:var(--on-fill); padding:12px 16px;
      -webkit-appearance:none; appearance:none; min-height:44px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">BF</div>
    <h1>Offline</h1>
    <p>This page was never saved on the device, so there is nothing to show yet. Pages you have already opened still work offline.</p>
    <div class="card">
      <b id="state">No connection · retrying every 10 minutes</b>
      <div id="next"></div>
    </div>
    <div class="links">
      <a href="/dashboard">Dashboard</a>
      <a href="/purchases">Purchases</a>
      <a href="/stores">Stores</a>
    </div>
    <button type="button" id="retry">Try again now</button>
  </div>
  <script>
    (function(){
      var KEY="bf-theme";
      var t=null;
      try { t=localStorage.getItem(KEY); } catch(e){}
      if(t!=="light"&&t!=="dark") t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
      document.documentElement.setAttribute("data-theme",t);
      var m=document.querySelector('meta[name="theme-color"]');
      if(m) m.setAttribute("content", t==="dark"?"#0a0a0a":"#ffffff");
    })();
    (function(){
      var RETRY_MS=600000;
      var IDLE="No connection · retrying every 10 minutes";
      var state=document.getElementById("state");
      var next=document.getElementById("next");
      var due=Date.now()+RETRY_MS;
      var busy=false;
      function paint(){
        var left=Math.max(0, Math.round((due-Date.now())/1000));
        var mm=Math.floor(left/60), ss=left%60;
        if(next) next.textContent="Next try in "+mm+":"+(ss<10?"0":"")+ss;
        if(left<=0 && !busy) probe();
      }
      /* Only the server answering counts as back: the device can be on a
         network the app cannot reach. */
      function probe(){
        busy=true;
        if(state) state.textContent="Trying now…";
        fetch("/health", {cache:"no-store"}).then(function(r){
          if(r.ok){ location.reload(); return; }
          throw new Error("no server");
        }).catch(function(){
          busy=false;
          due=Date.now()+RETRY_MS;
          if(state) state.textContent=IDLE;
          paint();
        });
      }
      setInterval(paint, 1000);
      paint();
      window.addEventListener("online", probe);
      var retry=document.getElementById("retry");
      if(retry) retry.addEventListener("click", probe);
    })();
  </script>
</body>
</html>
