[project]
name = "bring-fast"
version = "1.0.0"
description = "Bring Fast — multi-user grocery MCP + dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
  "cryptography>=43.0.0",
  "requests>=2.32.0",
  "passlib[bcrypt]>=1.7.4",
]

[project.scripts]
bring-fast = "bring_fast.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
