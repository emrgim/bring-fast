name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Packaging
        run: |
          pip install build
          python -m build
          python -c "import zipfile, pathlib, sys
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert wheels, 'no wheel'
          names = zipfile.ZipFile(wheels[0]).namelist()
          assert any(n.endswith('bring_fast/templates/login.html') for n in names), names
          assert any(n.endswith('bring_fast/templates/store.html') for n in names), names
          assert any('/static/logos/' in n for n in names), names
          assert any(n.endswith('.woff2') for n in names), names
          assert any(n.endswith('bring_fast/static/pwa/sw.js') for n in names), names
          print('wheel includes templates, logos, fonts and the service worker')
          "
